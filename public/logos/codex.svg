<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" id="cloud-terminal-logo" viewBox="0 0 500 500" width="100%" height="100%">
        <defs>
          <!-- Soft Blue-to-Purple brand gradient -->
          <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#9aa5ff"/>
            <stop offset="100%" stop-color="#4d5eff"/>
          </linearGradient>
        </defs>

        <!-- Base Transparent Canvas View -->
        <rect width="500" height="500" fill="none"/>

        <!-- Asymmetric organic cloud structure geometry -->
        <path d="M 230 40 &#10;                 C 290 35, 360 65, 380 120 &#10;                 C 435 125, 475 175, 465 240 &#10;                 C 455 310, 420 365, 350 375 &#10;                 C 320 445, 220 475, 160 425 &#10;                 C 100 445, 45 375, 65 310 &#10;                 C 30 260, 40 180, 95 140 &#10;                 C 105 75, 170 45, 230 40 Z" fill="url(#cloudGrad)"/>

        <!-- White terminal prompt architecture: > _ -->
        <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
          <!-- Chevron (>) prompt path -->
          <path d="M 165 170 L 215 220 C 225 230, 225 240, 215 250 L 165 300"/>
          
          <!-- Blinking cursor (_) line path -->
          <path d="M 270 300 L 335 300"/>
        </g>
      </svg>