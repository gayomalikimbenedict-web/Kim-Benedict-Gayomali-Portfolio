<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" id="google-sheets-logo" viewBox="0 0 500 500" width="100%" height="100%">
        <!-- Transparent Canvas Background Layer -->
        <rect width="500" height="500" fill="none"/>

        <!-- Main Document Body with folded corner cutout -->
        <!-- Path starts at top-left, moves right, down before fold corner, forms the fold boundary, down to bottom, and closes -->
        <path d="M 130 70 &#10;                 L 340 70 &#10;                 L 410 140 &#10;                 L 410 410 &#10;                 C 410 426, 396 440, 380 440 &#10;                 L 130 440 &#10;                 C 114 440, 100 426, 100 410 &#10;                 L 100 90 &#10;                 C 100 74, 114 70, 130 70 Z" fill="#0F9D58"/>

        <!-- Top-Right Folded Page Flap Document Geometry -->
        <path d="M 340 70 &#10;                 L 410 140 &#10;                 L 360 140 &#10;                 C 344 140, 340 136, 340 120 Z" fill="#0B8043"/>

        <!-- Centered Spreadsheet Grid Structure (田) -->
        <g fill="#FFFFFF">
          <!-- Outer Grid Board Matrix Frame Boundary -->
          <path d="M 170 190 L 330 190 L 330 310 L 170 310 Z M 190 210 L 190 290 L 310 290 L 310 210 Z"/>
          <!-- Central Grid Separator Crossbars -->
          <rect x="242" y="190" width="16" height="120"/>
          <rect x="170" y="242" width="160" height="16"/>
        </g>
      </svg>